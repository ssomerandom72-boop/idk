<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Workstation Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 360px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .track-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .track-title {
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
        }
        .track-artist {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }
        button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:hover { background: #2563eb; }
        .secondary-btn {
            background: #475569;
            width: 40px;
            height: 40px;
        }
        .secondary-btn:hover { background: #334155; }
        .progress-container {
            width: 100%;
            margin-top: 15px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
        }
        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        .playlist {
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .playlist-item {
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .playlist-item:hover, .playlist-item.active {
            background: #334155;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="track-info">
        <div class="track-title" id="title">Select Track</div>
        <div class="track-artist" id="artist">Local Audio Source</div>
    </div>

    <audio id="audioPlayer"></audio>

    <div class="progress-container">
        <input type="range" id="seekBar" value="0" min="0" step="0.1">
        <div class="time-stamps">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="secondary-btn" id="prevBtn">«</button>
        <button id="playBtn">▶</button>
        <button class="secondary-btn" id="nextBtn">»</button>
    </div>

    <div class="playlist" id="playlist">
        <!-- Playlist items rendered dynamically -->
    </div>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');

    // Replace src paths with your hosted MP3 relative URLs or local paths
    const tracks = [
        { title: "Audio Track 01", artist: "Artist A", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { title: "Audio Track 02", artist: "Artist B", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { title: "Audio Track 03", artist: "Artist C", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let currentTrackIndex = 0;

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].src;
        title.textContent = tracks[index].title;
        artist.textContent = tracks[index].artist;
        updatePlaylistUI();
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            playBtn.textContent = '❚❚';
        } else {
            audio.pause();
            playBtn.textContent = '▶';
        }
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            seekBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        }
    });

    seekBar.addEventListener('input', () => {
        if (audio.duration) {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
    });

    playBtn.addEventListener('click', togglePlay);

    prevBtn.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.textContent = '❚❚';
    });

    nextBtn.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.textContent = '❚❚';
    });

    function updatePlaylistUI() {
        playlistEl.innerHTML = '';
        tracks.forEach((track, idx) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${idx === currentTrackIndex ? 'active' : ''}`;
            item.textContent = `${idx + 1}. ${track.title}`;
            item.addEventListener('click', () => {
                loadTrack(idx);
                audio.play();
                playBtn.textContent = '❚❚';
            });
            playlistEl.appendChild(item);
        });
    }

    // Initialize
    loadTrack(currentTrackIndex);
</script>
</body>
</html>
